<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Dinero - Alke Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="menu.html"><i class="fas fa-arrow-left me-2"></i> Volver</a>
            <span class="navbar-text text-white">Enviar Dinero</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="mb-4">
                    <h6 class="text-muted mb-3">Contactos Recientes</h6>
                    <div class="d-flex gap-3 overflow-auto pb-2">
                        <div class="text-center">
                            <img src="https://ui-avatars.com/api/?name=Ana+P&background=random" class="rounded-circle mb-1" width="50">
                            <small class="d-block">Ana</small>
                        </div>
                        <div class="text-center">
                            <img src="https://ui-avatars.com/api/?name=Carlos+D&background=random" class="rounded-circle mb-1" width="50">
                            <small class="d-block">Carlos</small>
                        </div>
                        <div class="text-center">
                            <button class="btn btn-outline-secondary rounded-circle" style="width: 50px; height: 50px;"><i class="fas fa-plus"></i></button>
                            <small class="d-block">Nuevo</small>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <form id="transferForm">
                            <div class="mb-3">
                                <label class="form-label text-muted">Destinatario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-primary"></i></span>
                                    <input type="email" class="form-control border-start-0 ps-0" placeholder="correo@ejemplo.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted">Monto a transferir</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text bg-white border-end-0">$</span>
                                    <input type="number" class="form-control border-start-0 ps-0 fw-bold" placeholder="0" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 shadow-sm">
                                Confirmar Transferencia <i class="fas fa-paper-plane ms-2"></i>
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Pequeño script para simular el envío
        $(document).ready(function(){
            $('#transferForm').submit(function(e){
                e.preventDefault();
                alert('¡Transferencia realizada con éxito!');
                window.location.href = 'menu.html';
            });
        });
    </script>
</body>
</html>
