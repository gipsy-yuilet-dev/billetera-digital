<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos - Alke Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .transaction-item {
            transition: all 0.2s;
            cursor: pointer;
        }
        .transaction-item:hover {
            background-color: #f8f9fa;
            transform: translateX(5px);
        }
        .amount-positive { color: #198754; font-weight: bold; }
        .amount-negative { color: #dc3545; font-weight: bold; }
        .date-divider {
            background-color: #e9ecef;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #495057;
            border-left: 4px solid #0d6efd;
        }
        .transaction-icon-receive {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .transaction-icon-send {
            background-color: #f8d7da;
            color: #842029;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="menu.html"><i class="fas fa-arrow-left me-2"></i> Volver</a>
            <div class="d-flex align-items-center gap-3">
                <div class="text-white text-end d-none d-md-block">
                    <div class="fw-bold"><i class="fas fa-user-circle"></i> <span class="userName">Usuario</span></div>
                    <small id="connectionInfo" class="text-white-50"><i class="fas fa-clock"></i> Conectado</small>
                </div>
                <span class="navbar-text text-white fw-bold">Historial de Transacciones</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                
                <!-- Resumen -->
                <div class="row mb-4 g-3">
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body text-center">
                                <i class="fas fa-exchange-alt fa-2x text-primary mb-2"></i>
                                <h6 class="text-muted mb-1">Total Transacciones</h6>
                                <h4 class="fw-bold mb-0" id="totalTransactions">0</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body text-center">
                                <i class="fas fa-arrow-down fa-2x text-success mb-2"></i>
                                <h6 class="text-muted mb-1">Total Recibido</h6>
                                <h4 class="fw-bold mb-0 text-success" id="totalReceived">$0.00</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body text-center">
                                <i class="fas fa-arrow-up fa-2x text-danger mb-2"></i>
                                <h6 class="text-muted mb-1">Total Enviado</h6>
                                <h4 class="fw-bold mb-0 text-danger" id="totalSent">$0.00</h4>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Mensaje personalizado -->
                <div class="alert alert-info mb-4" id="welcomeMessage">
                    <i class="fas fa-info-circle"></i> <strong class="userName">Usuario</strong>, hoy <span id="currentDate"></span> estas son las transacciones realizadas a la fecha.
                </div>

                <!-- Lista de Transacciones -->
                <div class="card shadow border-0 rounded-4">
                    <div class="card-header bg-white border-0 py-3 rounded-top-4 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold">Todas las Transacciones</h5>
                        <div class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn btn-outline-primary active" id="filterAll">Todas</button>
                            <button type="button" class="btn btn-outline-success" id="filterReceived">Recibidas</button>
                            <button type="button" class="btn btn-outline-danger" id="filterSent">Enviadas</button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="transactionsList">
                            <!-- Se llena dinámicamente con JavaScript -->
                            <div class="text-center p-5 text-muted">
                                <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                                <p>Cargando transacciones...</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
