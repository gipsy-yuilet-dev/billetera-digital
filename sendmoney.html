<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Dinero - Alke Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .send-card {
            max-width: 500px;
            margin: 50px auto;
        }
        .contact-avatar {
            cursor: pointer;
            transition: all 0.3s;
        }
        .contact-avatar:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="menu.html"><i class="fas fa-arrow-left me-2"></i> Volver</a>
            <div class="d-flex align-items-center gap-3">
                <div class="text-white text-end d-none d-md-block">
                    <div class="fw-bold"><i class="fas fa-user-circle"></i> <span class="userName">Usuario</span></div>
                    <small id="connectionInfo" class="text-white-50"><i class="fas fa-clock"></i> Conectado</small>
                </div>
                <span class="navbar-text text-white fw-bold">Enviar Dinero</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Contactos Recientes -->
        <div class="mb-4 text-center">
            <h6 class="text-muted mb-3"><i class="fas fa-users me-2"></i>Contactos Frecuentes</h6>
            <div id="quickContacts" class="d-flex gap-3 justify-content-center overflow-auto pb-2">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

        <div class="card shadow-lg send-card border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                        <i class="fas fa-paper-plane fa-3x text-primary"></i>
                    </div>
                    <h3 class="fw-bold">Enviar Dinero</h3>
                    <p class="text-muted">Transfiere a tus contactos</p>
                </div>

                <form id="sendMoneyForm">
                    <div class="mb-4">
                        <label for="recipientEmail" class="form-label fw-bold">Destinatario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="email" class="form-control" id="recipientEmail" 
                                   placeholder="correo@ejemplo.com" required>
                        </div>
                        <small class="text-muted">Ingresa el email del destinatario</small>
                    </div>

                    <div class="mb-4">
                        <label for="sendAmount" class="form-label fw-bold">Monto a Enviar</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-primary text-white">$</span>
                            <input type="number" class="form-control" id="sendAmount" 
                                   placeholder="0.00" min="1" step="0.01" required
                                   onkeypress="return (event.charCode >= 48 && event.charCode <= 57) || event.charCode == 46">
                        </div>
                        <small class="text-muted">Saldo disponible: <span id="availableBalance" class="fw-bold">$0.00</span></small>
                    </div>

                    <!-- Montos Rápidos -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Montos Rápidos</label>
                        <div class="d-flex flex-wrap justify-content-center gap-2">
                            <button type="button" class="btn btn-outline-primary btn-sm quick-amount" data-amount="10">$10</button>
                            <button type="button" class="btn btn-outline-primary btn-sm quick-amount" data-amount="25">$25</button>
                            <button type="button" class="btn btn-outline-primary btn-sm quick-amount" data-amount="50">$50</button>
                            <button type="button" class="btn btn-outline-primary btn-sm quick-amount" data-amount="100">$100</button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="sendDescription" class="form-label fw-bold">Descripción</label>
                        <input type="text" class="form-control" id="sendDescription" 
                               placeholder="Ej: Pago de cena, Regalo, etc." required>
                    </div>

                    <div id="success-msg" class="alert alert-success d-none" role="alert">
                        <i class="fas fa-check-circle"></i> ¡Dinero enviado exitosamente!
                    </div>
                    <div id="error-msg" class="alert alert-danger d-none" role="alert">
                        <i class="fas fa-exclamation-circle"></i> <span id="error-text"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fas fa-paper-plane me-2"></i>Enviar Dinero
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- jQuery y Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Configuración y constantes -->
    <script src="js/config/constants.js"></script>
    
    <!-- Servicios -->
    <script src="js/services/storageService.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/services/authService.js"></script>
    <script src="js/services/transactionService.js"></script>
    
    <!-- Página específica -->
    <script src="js/pages/sendmoney.js"></script>
</body>
</html>
