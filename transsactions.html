<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos - Alke Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .transaction-item {
            transition: background-color 0.2s;
        }
        .transaction-item:hover {
            background-color: #f8f9fa;
        }
        .amount-positive { color: #198754; font-weight: bold; }
        .amount-negative { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="menu.html"><i class="fas fa-arrow-left me-2"></i> Volver</a>
            <span class="navbar-text text-white">Historial</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="card shadow border-0 rounded-4">
                    <div class="card-header bg-white border-0 py-3 rounded-top-4">
                        <h5 class="mb-0 fw-bold">Últimos Movimientos</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush">
                            
                            <div class="list-group-item p-3 transaction-item d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <div class="rounded-circle bg-light p-2 me-3 text-primary">
                                        <i class="fas fa-store fa-lg"></i>
                                    </div>
                                    <div>
                                        <h6 class="mb-0">Supermercado Líder</h6>
                                        <small class="text-muted">Hace 2 horas</small>
                                    </div>
                                </div>
                                <span class="amount-negative">-$ 45.000</span>
                            </div>

                            <div class="list-group-item p-3 transaction-item d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <div class="rounded-circle bg-light p-2 me-3 text-success">
                                        <i class="fas fa-arrow-down fa-lg"></i>
                                    </div>
                                    <div>
                                        <h6 class="mb-0">Transferencia Recibida</h6>
                                        <small class="text-muted">Ayer</small>
                                    </div>
                                </div>
                                <span class="amount-positive">+$ 120.000</span>
                            </div>

                            <div class="list-group-item p-3 transaction-item d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <div class="rounded-circle bg-light p-2 me-3 text-danger">
                                        <i class="fas fa-lightbulb fa-lg"></i>
                                    </div>
                                    <div>
                                        <h6 class="mb-0">Pago de Servicios (Luz)</h6>
                                        <small class="text-muted">20 Oct 2023</small>
                                    </div>
                                </div>
                                <span class="amount-negative">-$ 15.000</span>
                            </div>

                             <div class="list-group-item p-3 transaction-item d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <div class="rounded-circle bg-light p-2 me-3 text-primary">
                                        <i class="fas fa-utensils fa-lg"></i>
                                    </div>
                                    <div>
                                        <h6 class="mb-0">Restaurante El Tenedor</h6>
                                        <small class="text-muted">18 Oct 2023</small>
                                    </div>
                                </div>
                                <span class="amount-negative">-$ 32.500</span>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- jQuery y Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Configuración y constantes -->
    <script src="js/config/constants.js"></script>
    
    <!-- Servicios -->
    <script src="js/services/storageService.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/services/authService.js"></script>
    <script src="js/services/transactionService.js"></script>
    
    <!-- Página específica -->
    <script src="js/pages/transactions.js"></script>
</body>
</html>
