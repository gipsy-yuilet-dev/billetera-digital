<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos - MY Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="menu.html"><i class="fas fa-arrow-left me-2"></i> Volver</a>
            <div class="d-flex align-items-center gap-3">
                <div class="text-white text-end d-none d-md-block">
                    <div class="fw-bold"><i class="fas fa-user-circle"></i> <span class="userName">Usuario</span></div>
                    <small id="connectionInfo" class="text-white-50"><i class="fas fa-clock"></i> Conectado</small>
                </div>
                <span class="navbar-text text-white fw-bold">Mis Contactos</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <!-- Botón para agregar nuevo contacto -->
                <div class="mb-3 text-end">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addContactModal">
                        <i class="fas fa-user-plus me-2"></i>Agregar Contacto
                    </button>
                </div>

                <!-- Filtros -->
                <div class="card shadow border-0 rounded-4 mb-3">
                    <div class="card-body">
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-outline-primary active" id="filterAll">
                                <i class="fas fa-users me-1"></i>Todos
                            </button>
                            <button type="button" class="btn btn-outline-success" id="filterDebtors">
                                <i class="fas fa-hand-holding-usd me-1"></i>Me Deben
                            </button>
                            <button type="button" class="btn btn-outline-danger" id="filterCreditors">
                                <i class="fas fa-file-invoice-dollar me-1"></i>Les Debo
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="card shadow border-0 rounded-4">
                    <div class="card-header bg-white border-0 py-3 rounded-top-4">
                        <h5 class="mb-0 fw-bold"><i class="fas fa-users me-2"></i>Lista de Contactos</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush" id="contacts-list">
                            <!-- Se llena dinámicamente con JavaScript -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal para agregar contacto -->
    <div class="modal fade" id="addContactModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-user-plus me-2"></i>Agregar Nuevo Contacto
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addContactForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="contactName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="contactEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo de Relación</label>
                            <select class="form-select" id="contactType" required>
                                <option value="normal">Normal</option>
                                <option value="debtor">Me Debe (Deudor)</option>
                                <option value="creditor">Le Debo (Acreedor/Proveedor)</option>
                            </select>
                            <div class="form-text">
                                • <strong>Normal</strong>: Contacto estándar<br>
                                • <strong>Me Debe</strong>: Persona que te debe dinero<br>
                                • <strong>Le Debo</strong>: Persona o proveedor al que le debes
                            </div>
                        </div>
                        <div class="mb-3" id="amountContainer" style="display: none;">
                            <label class="form-label">Monto</label>
                            <input type="number" class="form-control" id="contactAmount" min="0" step="0.01" value="0">
                            <div class="form-text">Opcional: Monto que se debe o te deben</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono (Opcional)</label>
                            <input type="tel" class="form-control" id="contactPhone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notas (Opcional)</label>
                            <textarea class="form-control" id="contactNotes" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="saveContactBtn">
                        <i class="fas fa-save me-2"></i>Guardar Contacto
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery y Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Configuración y constantes -->
    <script src="js/config/constants.js"></script>
    
    <!-- Servicios -->
    <script src="js/services/storageService.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/services/authService.js"></script>
    
    <!-- Página específica -->
    <script src="js/pages/contacts.js"></script>
</body>
</html>
