<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Cuentas - MY Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="menu.html"><i class="fas fa-arrow-left me-2"></i> Volver</a>
            <div class="d-flex align-items-center gap-3">
                <div class="text-white text-end d-none d-md-block">
                    <div class="fw-bold"><i class="fas fa-user-circle"></i> <span class="userName">Usuario</span></div>
                    <small id="connectionInfo" class="text-white-50"><i class="fas fa-clock"></i> Conectado</small>
                </div>
                <span class="navbar-text text-white fw-bold">Mis Cuentas</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4><i class="fas fa-wallet me-2"></i>Administrar Cuentas</h4>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newAccountModal">
                        <i class="fas fa-plus-circle me-2"></i>Nueva Cuenta
                    </button>
                </div>

                <!-- Lista de Cuentas -->
                <div id="accountsList" class="row g-4">
                    <!-- Se llena dinámicamente -->
                </div>

            </div>
        </div>
    </div>

    <!-- Modal para Nueva Cuenta -->
    <div class="modal fade" id="newAccountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i>Crear Nueva Cuenta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="newAccountForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="accountName" class="form-label fw-bold">Nombre de la Cuenta</label>
                            <input type="text" class="form-control" id="accountName" 
                                   placeholder="Ej: Cuenta de Ahorro" required>
                        </div>
                        <div class="mb-3">
                            <label for="accountType" class="form-label fw-bold">Tipo de Cuenta</label>
                            <select class="form-select" id="accountType" required>
                                <option value="">Selecciona un tipo</option>
                                <option value="corriente">Cuenta Corriente</option>
                                <option value="ahorro">Cuenta de Ahorro</option>
                                <option value="inversion">Cuenta de Inversión</option>
                                <option value="otro">Otra</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="initialBalance" class="form-label fw-bold">Saldo Inicial (Opcional)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="initialBalance" 
                                       placeholder="0.00" min="0" step="0.01" value="0">
                            </div>
                        </div>
                        <div id="create-error" class="alert alert-danger d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check me-2"></i>Crear Cuenta
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- jQuery y Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Configuración y constantes -->
    <script src="js/config/constants.js"></script>
    
    <!-- Servicios -->
    <script src="js/services/storageService.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/services/authService.js"></script>
    
    <!-- Página específica -->
    <script src="js/pages/accounts.js"></script>
</body>
</html>
